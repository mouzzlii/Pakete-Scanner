
name: Build TRAKUNA 2.0

on:
  push:
    branches:
      - phoenix-rebuild
  workflow_dispatch:

jobs:
  build:
    name: Android APK bauen
    runs-on: ubuntu-latest

    steps:
      - name: Code herunterladen
        uses: actions/checkout@v4

      - name: Java installieren
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: 17

      - name: Android SDK einrichten
        uses: android-actions/setup-android@v3
        with:
          packages: platform-tools

      - name: Android SDK installieren
        run: |
          yes | sdkmanager --licenses
          sdkmanager "platforms;android-35" "build-tools;35.0.0"

      - name: Gradle 8.9 installieren
        run: |
          curl -L https://services.gradle.org/distributions/gradle-8.9-bin.zip -o gradle.zip
          unzip -q gradle.zip
          echo "$GITHUB_WORKSPACE/gradle-8.9/bin" >> "$GITHUB_PATH"

      - name: TRAKUNA APK bauen
        run: gradle assembleDebug

      - name: APK bereitstellen
        uses: actions/upload-artifact@v4
        with:
          name: TRAKUNA-2.0-APK
          path: app/build/outputs/apk/debug/*.apk
          if-no-files-found: error
