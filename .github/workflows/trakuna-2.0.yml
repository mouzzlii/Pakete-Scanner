name: Build TRAKUNA 2.0

concurrency:
  group: trakuna-android-${{ github.ref }}
  cancel-in-progress: true

on:
  push:
    branches:
      - fix/trakuna-scroll-layout
  pull_request:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 25

    steps:
      - name: Repository laden
        uses: actions/checkout@v7

      - name: Java einrichten
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '17'

      - name: Gradle einrichten
        uses: gradle/actions/setup-gradle@v6
        with:
          gradle-version: '8.9'

      - name: Android SDK einrichten
        uses: android-actions/setup-android@v4

      - name: Android SDK-Lizenzen akzeptieren und Plattform installieren
        shell: bash
        run: |
          sdkmanager --licenses </dev/null
          sdkmanager "platforms;android-35" "build-tools;35.0.0"

      - name: Unit-Tests ausführen
        run: gradle --no-daemon testDebugUnitTest

      - name: Android Lint ausführen
        run: gradle --no-daemon lintDebug

      - name: APK bauen
        run: gradle --no-daemon assembleDebug

      - name: APK bereitstellen
        uses: actions/upload-artifact@v6
        with:
          name: TRAKUNA-2.0-Android
          path: app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 30
