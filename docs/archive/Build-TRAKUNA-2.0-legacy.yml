
name: Build TRAKUNA 2.0

on:
  push:
    paths:
      - '.github/workflows/trakuna-2.0.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Repository laden
        uses: actions/checkout@v4

      - name: Java einrichten
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Gradle einrichten
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Android SDK einrichten
        uses: android-actions/setup-android@v3

      - name: Android Lizenzen und Pakete installieren
        shell: bash
        run: |
          yes | sdkmanager --licenses
          sdkmanager "platform-tools" "platforms;android-35" "build-tools;35.0.0"

      - name: Android Projekt erstellen
        shell: bash
        run: |
          mkdir -p app/src/main/java/at/trakuna/app

          cat > settings.gradle.kts <<'EOF'
          pluginManagement {
              repositories {
                  google()
                  mavenCentral()
                  gradlePluginPortal()
              }
          }
          dependencyResolutionManagement {
              repositoriesMode.set(RepositoriesMode.FAIL_ON_PROJECT_REPOS)
              repositories {
                  google()
                  mavenCentral()
              }
          }
          rootProject.name = "TRAKUNA"
          include(":app")
          EOF

          cat > build.gradle.kts <<'EOF'
          plugins {
              id("com.android.application") version "8.7.3" apply false
              id("org.jetbrains.kotlin.android") version "2.0.21" apply false
              id("org.jetbrains.kotlin.plugin.compose") version "2.0.21" apply false
          }
          EOF

          cat > gradle.properties <<'EOF'
          org.gradle.jvmargs=-Xmx3g -Dfile.encoding=UTF-8
          android.useAndroidX=true
          kotlin.code.style=official
          EOF

          cat > app/build.gradle.kts <<'EOF'
          plugins {
              id("com.android.application")
              id("org.jetbrains.kotlin.android")
              id("org.jetbrains.kotlin.plugin.compose")
          }

          android {
              namespace = "at.trakuna.app"
              compileSdk = 35

              defaultConfig {
                  applicationId = "at.trakuna.app"
                  minSdk = 24
                  targetSdk = 34
                  versionCode = 2
                  versionName = "2.0"
              }

              buildFeatures {
                  compose = true
              }
          }

          dependencies {
              implementation(platform("androidx.compose:compose-bom:2024.10.01"))
              implementation("androidx.activity:activity-compose:1.9.3")
              implementation("androidx.compose.ui:ui")
              implementation("androidx.compose.material3:material3")
              implementation("androidx.compose.foundation:foundation")
              implementation("com.google.android.gms:play-services-code-scanner:16.1.0")
          }
          EOF

          cat > app/src/main/AndroidManifest.xml <<'EOF'
          <manifest xmlns:android="http://schemas.android.com/apk/res/android">
              <application
                  android:allowBackup="true"
                  android:label="TRAKUNA"
                  android:theme="@android:style/Theme.Material.Light.NoActionBar">
                  <meta-data
                      android:name="com.google.mlkit.vision.DEPENDENCIES"
                      android:value="barcode" />
                  <activity
                      android:name=".MainActivity"
                      android:exported="true">
                      <intent-filter>
                          <action android:name="android.intent.action.MAIN" />
                          <category android:name="android.intent.category.LAUNCHER" />
                      </intent-filter>
                  </activity>
              </application>
          </manifest>
          EOF

          cat > app/src/main/java/at/trakuna/app/MainActivity.kt <<'EOF'
          package at.trakuna.app

          import android.content.Context
          import android.os.Bundle
          import androidx.activity.ComponentActivity
          import androidx.activity.compose.setContent
          import androidx.compose.foundation.clickable
          import androidx.compose.foundation.layout.*
          import androidx.compose.foundation.lazy.LazyColumn
          import androidx.compose.foundation.lazy.items
          import androidx.compose.foundation.shape.RoundedCornerShape
          import androidx.compose.material3.*
          import androidx.compose.runtime.*
          import androidx.compose.ui.Modifier
          import androidx.compose.ui.graphics.Color
          import androidx.compose.ui.platform.LocalContext
          import androidx.compose.ui.text.font.FontWeight
          import androidx.compose.ui.unit.dp
          import androidx.compose.ui.unit.sp
          import com.google.android.gms.mlkit.codescanner.GmsBarcodeScanning
          import org.json.JSONArray
          import org.json.JSONObject
          import java.text.SimpleDateFormat
          import java.util.Date
          import java.util.Locale
          import kotlin.random.Random

          private val Wald = Color(0xFF174D39)
          private val Hintergrund = Color(0xFFF1F5F2)

          data class Sendung(
              val id: String,
              val nummer: String,
              val dienst: String,
              val kunde: String,
              val vorgang: String,
              val status: String,
              val pin: String,
              val zeit: Long
          )

          class MainActivity : ComponentActivity() {
              override fun onCreate(savedInstanceState: Bundle?) {
                  super.onCreate(savedInstanceState)
                  setContent { Trakuna() }
              }
          }

          @Composable
          fun Trakuna() {
              val context = LocalContext.current
              val prefs = remember {
                  context.getSharedPreferences("trakuna", Context.MODE_PRIVATE)
              }
              val sendungen = remember {
                  mutableStateListOf<Sendung>().apply {
                      addAll(laden(prefs.getString("daten", "[]") ?: "[]"))
                  }
              }

              var seite by remember { mutableStateOf("start") }
              var vorgang by remember { mutableStateOf("Annahme") }
              var formular by remember { mutableStateOf(false) }
              var nummer by remember { mutableStateOf("") }
              var dienst by remember { mutableStateOf("Unbekannt") }
              var kunde by remember { mutableStateOf("") }
              var suche by remember { mutableStateOf("") }
              var meldung by remember { mutableStateOf("") }

              fun speichern() {
                  prefs.edit().putString("daten", speichernJson(sendungen)).apply()
              }

              fun formularOeffnen(art: String, scan: String = "") {
                  vorgang = art
                  nummer = scan
                  dienst = "Unbekannt"
                  kunde = ""
                  meldung = ""
                  formular = true
              }

              fun ausfuehren() {
                  val eingabe = nummer.trim()
                  if (eingabe.isBlank()) {
                      meldung = "Bitte Nummer eingeben."
                      return
                  }

                  if (vorgang == "Abholung") {
                      val index = sendungen.indexOfFirst {
                          it.nummer.equals(eingabe, true) || it.pin == eingabe
                      }
                      if (index == -1) {
                          meldung = "Sendung nicht gefunden."
                          return
                      }
                      if (sendungen[index].status == "Abgeholt") {
                          meldung = "Bereits abgeholt."
                          return
                      }
                      sendungen[index] = sendungen[index].copy(status = "Abgeholt")
                      speichern()
                      formular = false
                      meldung = "Abholung lokal gespeichert."
                      return
                  }

                  val pin = if (vorgang == "Annahme") {
                      Random.nextInt(1000, 10000).toString()
                  } else ""

                  val status = when (vorgang) {
                      "Annahme" -> "Eingelagert"
                      "Retoure" -> "Zur Übergabe bereit"
                      else -> "Versand vorgemerkt"
                  }

                  sendungen.add(
                      0,
                      Sendung(
                          System.currentTimeMillis().toString(),
                          eingabe,
                          dienst,
                          kunde,
                          vorgang,
                          status,
                          pin,
                          System.currentTimeMillis()
                      )
                  )
                  speichern()
                  formular = false
                  meldung = if (pin.isNotEmpty()) {
                      "Gespeichert. Abhol-PIN: $pin"
                  } else {
                      "Vorgang lokal gespeichert."
                  }
              }

              MaterialTheme(
                  colorScheme = lightColorScheme(
                      primary = Wald,
                      background = Hintergrund,
                      surface = Color.White
                  )
              ) {
                  Surface(
                      modifier = Modifier.fillMaxSize(),
                      color = Hintergrund
                  ) {
                      Column(Modifier.fillMaxSize().padding(16.dp)) {
                          Text(
                              "TRAKUNA",
                              fontSize = 29.sp,
                              fontWeight = FontWeight.Bold,
                              color = Wald
                          )
                          Text(
                              "ALLE PAKETDIENSTE. EIN SMARTPHONE.",
                              fontSize = 10.sp,
                              color = Wald
                          )
                          Spacer(Modifier.height(22.dp))

                          if (seite == "start") {
                              Text(
                                  "Paketshop-Zentrale",
                                  fontSize = 22.sp,
                                  fontWeight = FontWeight.Bold
                              )
                              Text("Was möchtest du erledigen?")
                              Spacer(Modifier.height(16.dp))

                              Button(
                                  onClick = {
                                      GmsBarcodeScanning.getClient(context)
                                          .startScan()
                                          .addOnSuccessListener {
                                              formularOeffnen("Annahme", it.rawValue ?: "")
                                          }
                                          .addOnFailureListener {
                                              formularOeffnen("Annahme")
                                              meldung = "Scan nicht verfügbar. Nummer manuell eingeben."
                                          }
                                  },
                                  modifier = Modifier.fillMaxWidth().height(60.dp)
                              ) {
                                  Text("PAKET SCANNEN", fontSize = 18.sp)
                              }

                              Spacer(Modifier.height(12.dp))
                              Aktion("ANNAHME", "Sendung entgegennehmen") {
                                  formularOeffnen("Annahme")
                              }
                              Aktion("ABHOLUNG", "Sendung an Kunden ausgeben") {
                                  formularOeffnen("Abholung")
                              }
                              Aktion("RETOURE", "Retoure entgegennehmen") {
                                  formularOeffnen("Retoure")
                              }
                              Aktion("VERSAND", "Versand vormerken") {
                                  formularOeffnen("Versand")
                              }

                              Spacer(Modifier.height(12.dp))
                              Card(Modifier.fillMaxWidth()) {
                                  Column(Modifier.padding(16.dp)) {
                                      Text("ÜBERSICHT", color = Wald, fontWeight = FontWeight.Bold)
                                      Text("Erfasste Vorgänge: ${sendungen.size}")
                                      Text("Noch nicht abgeholt: ${sendungen.count { it.status != "Abgeholt" }}")
                                  }
                              }
                              Spacer(Modifier.height(10.dp))
                              OutlinedButton(
                                  onClick = { seite = "liste" },
                                  modifier = Modifier.fillMaxWidth()
                              ) {
                                  Text("ALLE SENDUNGEN ANZEIGEN")
                              }
                          } else {
                              Text("Sendungsübersicht", fontSize = 22.sp, fontWeight = FontWeight.Bold)
                              OutlinedTextField(
                                  value = suche,
                                  onValueChange = { suche = it },
                                  label = { Text("Nummer, PIN oder Kunde suchen") },
                                  modifier = Modifier.fillMaxWidth(),
                                  singleLine = true
                              )
                              Spacer(Modifier.height(8.dp))
                              LazyColumn(
                                  modifier = Modifier.weight(1f),
                                  verticalArrangement = Arrangement.spacedBy(8.dp)
                              ) {
                                  items(sendungen.filter {
                                      it.nummer.contains(suche, true) ||
                                      it.kunde.contains(suche, true) ||
                                      it.pin.contains(suche, true)
                                  }, key = { it.id }) { s ->
                                      Card(Modifier.fillMaxWidth()) {
                                          Column(Modifier.padding(12.dp)) {
                                              Text(s.nummer, color = Wald, fontWeight = FontWeight.Bold)
                                              Text("${s.vorgang} • ${s.dienst}")
                                              if (s.kunde.isNotBlank()) Text("Kunde: ${s.kunde}")
                                              Text("Status: ${s.status}")
                                              if (s.pin.isNotBlank()) Text("Abhol-PIN: ${s.pin}")
                                              Text(
                                                  SimpleDateFormat("dd.MM.yyyy HH:mm", Locale.GERMANY)
                                                      .format(Date(s.zeit))
                                              )
                                          }
                                      }
                                  }
                              }
                              OutlinedButton(
                                  onClick = { seite = "start" },
                                  modifier = Modifier.fillMaxWidth()
                              ) {
                                  Text("ZURÜCK")
                              }
                          }

                          if (meldung.isNotBlank()) {
                              Spacer(Modifier.height(8.dp))
                              Text(meldung, color = Wald)
                          }
                      }
                  }

                  if (formular) {
                      AlertDialog(
                          onDismissRequest = { formular = false },
                          title = { Text(vorgang) },
                          text = {
                              Column(verticalArrangement = Arrangement.spacedBy(8.dp)) {
                                  OutlinedTextField(
                                      value = nummer,
                                      onValueChange = { nummer = it },
                                      label = {
                                          Text(
                                              if (vorgang == "Abholung")
                                                  "Sendungsnummer oder Abhol-PIN"
                                              else "Sendungsnummer / Barcode"
                                          )
                                      },
                                      singleLine = true
                                  )
                                  if (vorgang != "Abholung") {
                                      OutlinedTextField(
                                          value = dienst,
                                          onValueChange = { dienst = it },
                                          label = { Text("Paketdienst") },
                                          singleLine = true
                                      )
                                      OutlinedTextField(
                                          value = kunde,
                                          onValueChange = { kunde = it },
                                          label = { Text("Kundenname (optional)") },
                                          singleLine = true
                                      )
                                  }
                                  if (meldung.isNotBlank()) Text(meldung, color = Color.Red)
                              }
                          },
                          confirmButton = {
                              Button(onClick = { ausfuehren() }) {
                                  Text("SPEICHERN")
                              }
                          },
                          dismissButton = {
                              TextButton(onClick = { formular = false }) {
                                  Text("ABBRECHEN")
                              }
                          }
                      )
                  }
              }
          }

          @Composable
          fun Aktion(titel: String, untertitel: String, klick: () -> Unit) {
              Card(
                  modifier = Modifier
                      .fillMaxWidth()
                      .padding(vertical = 4.dp)
                      .clickable { klick() },
                  shape = RoundedCornerShape(14.dp)
              ) {
                  Column(Modifier.padding(15.dp)) {
                      Text(titel, color = Wald, fontWeight = FontWeight.Bold, fontSize = 17.sp)
                      Text(untertitel, fontSize = 12.sp)
                  }
              }
          }

          fun speichernJson(liste: List<Sendung>): String {
              val array = JSONArray()
              liste.forEach {
                  array.put(JSONObject().apply {
                      put("id", it.id)
                      put("nummer", it.nummer)
                      put("dienst", it.dienst)
                      put("kunde", it.kunde)
                      put("vorgang", it.vorgang)
                      put("status", it.status)
                      put("pin", it.pin)
                      put("zeit", it.zeit)
                  })
              }
              return array.toString()
          }

          fun laden(raw: String): List<Sendung> {
              return try {
                  val array = JSONArray(raw)
                  (0 until array.length()).map {
                      val o = array.getJSONObject(it)
                      Sendung(
                          o.optString("id"),
                          o.optString("nummer"),
                          o.optString("dienst"),
                          o.optString("kunde"),
                          o.optString("vorgang"),
                          o.optString("status"),
                          o.optString("pin"),
                          o.optLong("zeit")
                      )
                  }
              } catch (_: Exception) {
                  emptyList()
              }
          }
          EOF

      - name: APK bauen
        run: gradle --no-daemon assembleDebug

      - name: APK zum Herunterladen bereitstellen
        uses: actions/upload-artifact@v4
        with:
          name: TRAKUNA-2.0-Android
          path: app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
